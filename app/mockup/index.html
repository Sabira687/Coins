// ---------- helpers
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function cut(x, y, w, h, c) {   // rectangle with two cut corners (HUD look)
  ctx.beginPath(); ctx.moveTo(x + c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h - c); ctx.lineTo(x + w - c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + c); ctx.closePath();
}
function txt(s, x, y, size, color = TXT, align = "left", weight = "600", alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ui-monospace, "SF Mono", Menlo, monospace`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y); ctx.restore();
}
function brackets(cx, cy, w, h, len, color = G, lw = 2.5, alpha = 1) {
  const x = cx - w / 2, y = cy - h / 2;

  ctx.beginPath();
  ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
  ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
  ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
  ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);

}

// feathered scene image (the "live camera" look): coin crop faded into darkness
let feather = null;
function makeFeather() {
  const im = IMG.q; if (!ok(im) || feather) return;
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  g.filter = "brightness(.5) contrast(1.15) saturate(.8)"; g.drawImage(im, 0, 0, 512, 512); g.filter = "none"; g.globalCompositeOperation = "destination-in";
  const rg = g.createRadialGradient(256, 256, 120, 256, 256, 256); rg.addColorStop(0, "#fff"); rg.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = rg; g.fillRect(0, 0, 512, 512); feather = c;
}
function drawBackdrop(t) {          // dim textured "table" behind the feathered crop
  ctx.fillStyle = "#020804"; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, 400, 40, W / 2, 400, 520); g.addColorStop(0, "#06150a"); g.addColorStop(1, "#010402");

}

// ---------- coin geometry (in the 512 px crop: coin radius = 512 / (2 * margin))
const MARGIN = 2.86, R_IMG = 512 / (2 * MARGIN);
const SC_SCENE = 0.95, SC_RES = 1.85, CY_SCENE = 400, CY_RES = 470;

function drawCoinImage(scale, cy, jx, jy, mix) {   // mix 0 = feathered scene, 1 = full crop
  const im = IMG.q, s = 512 * scale, x = W / 2 + jx - s / 2, y = cy + jy - s / 2;
  if (!ok(im)) return;
  if (mix < 1 && feather) { ctx.globalAlpha = 1 - mix * .0; ctx.drawImage(feather, x, y, s, s); }
  if (mix > 0) { ctx.save(); ctx.globalAlpha = mix; ctx.drawImage(im, x, y, s, s); ctx.restore(); }
}
function scanLine(t, period, top = 0, bottom = H, alpha = 1) {
  const p = (t % period) / period, y = lerp(top, bottom, p < .5 ? p * 2 : 2 - p * 2);
  const g = ctx.createLinearGradient(0, y - 70, 0, y); g.addColorStop(0, "rgba(0,255,65,0)"); g.addColorStop(1, "rgba(0,255,65,.28)");
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.fillRect(0, y - 70, W, 70);
  ctx.strokeStyle = G; ctx.lineWidth = 1.6; ctx.shadowColor = G; ctx.shadowBlur = 12; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.restore();
}

  brackets(W / 2, H / 2, W - 28, H - 56, 26, G, 2, a);
  ctx.save(); ctx.globalAlpha = .12 * a; ctx.strokeStyle = G; ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(W * i / 3, 30); ctx.lineTo(W * i / 3, H - 30); ctx.moveTo(14, H * i / 3); ctx.lineTo(W - 14, H * i / 3); ctx.stroke(); }

  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}

  if (s === "result") { resultT0 = t0; }

document.querySelectorAll("#panel button").forEach(b => b.onclick = () => { audio(); if (b.dataset.s === "result" || b.dataset.s === "details") sheetP = b.dataset.s === "details" ? sheetP : 0; setState(b.dataset.s); });

// ---------- screens
function drawHome(t, now) {

  for (let k = 0; k < 14; k++) { const p = ((k + (now / 1500) % 1) / 14), y = hy + (H - hy) * p * p; ctx.globalAlpha = .6 * p + .1; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

function drawSearch(t, now, sub) {   // sub: "search" | "lock"
  drawBackdrop(t); makeFeather();
  const amp = sub === "lock" ? 1 - ease(t / .5) : 1, jx = Math.sin(now / 700) * 6 * amp, jy = Math.cos(now / 530) * 5 * amp;

}

function drawZoom(t, now) {

function drawResult(t, now) {   // t = seconds since result appeared
  ctx.fillStyle = "#020a05"; ctx.fillRect(0, 0, W, H);

  const top = ctx.createLinearGradient(0, 0, 0, 260); top.addColorStop(0, "rgba(2,6,8,.92)"); top.addColorStop(1, "rgba(2,6,8,0)"); ctx.fillStyle = top; ctx.fillRect(0, 0, W, 260);
  const bot = ctx.createLinearGradient(0, H - 230, 0, H); bot.addColorStop(0, "rgba(2,6,8,0)"); bot.addColorStop(1, "rgba(2,6,8,.95)"); ctx.fillStyle = bot; ctx.fillRect(0, H - 230, W, 230);
  const cx = W / 2, cy = CY_RES, rc = R_IMG * SC_RES, side = 2 * rc + 30;

  ctx.save(); ctx.strokeStyle = GD; ctx.lineWidth = 1.5; rr(W - 62, 36, 38, 26, 8); ctx.stroke(); ctx.restore();
  hit.close = [W - 62, 30, 44, 38];

function chipRow(y, items) {      // transparent chips, centred

  const ws = items.map(s => ctx.measureText(s).width + 20), gap = 8, total = ws.reduce((u, v) => u + v, 0) + gap * (items.length - 1);
  let x = (W - total) / 2;
  items.forEach((s, i) => { ctx.save(); ctx.strokeStyle = GD; ctx.lineWidth = 1; rr(x, y, ws[i], 24, 12); ctx.stroke(); ctx.restore(); txt(s, x + ws[i] / 2, y + 16, 11, TXT, "center", "600"); x += ws[i] + gap; });
}

// ---------- details sheet
function section(y, title) { txt(title, 24, y, 10, "#3f9a55", "left", "700"); ctx.strokeStyle = "rgba(0,255,65,.18)"; ctx.beginPath(); ctx.moveTo(24, y + 8); ctx.lineTo(W - 24, y + 8); ctx.stroke(); }
function thumb(im, x, y, s, zoom = .62) {
  if (!ok(im)) { ctx.fillStyle = "#0b1a12"; ctx.fillRect(x, y, s, s); return; }
  const N = im.naturalWidth, n = N * zoom, o = (N - n) / 2; ctx.drawImage(im, o, o, n, n, x, y, s, s);
}
function drawSheet(p, nowMs) {
  const top = lerp(H, 0, p);
  ctx.save(); ctx.globalAlpha = .62 * p; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); rr(0, top, W, H - top + 30, 26 * (1 - p)); ctx.fillStyle = "#020a04"; ctx.fill(); ctx.restore();
  hit.sheetTop = top;
  ctx.save(); rr(0, top, W, H - top, 26 * (1 - p)); ctx.clip();
  txt("ANALYSIS", 28, top + 52, 13, G, "left", "700");
  ctx.save(); ctx.strokeStyle = GD; ctx.lineWidth = 1.5; rr(W - 62, top + 36, 38, 26, 8); ctx.stroke(); ctx.restore();
  hit.sheetClose = [W - 62, top + 30, 44, 38];
  // scrollable body
  ctx.save(); ctx.beginPath(); ctx.rect(0, top + 80, W, H - top - 80); ctx.clip(); ctx.translate(0, top + 80 - scrollY);
  const a = ease((nowMs - dt0) / 700);
  let y = 14;
  // summary
  ctx.save(); ctx.beginPath(); ctx.arc(52, y + 36, 32, 0, 7); ctx.clip(); thumb(IMG.q, 20, y + 4, 64, .5); ctx.restore();
  ctx.save(); ctx.strokeStyle = G; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(52, y + 36, 32, 0, 7); ctx.stroke(); ctx.restore();
  glowText("20 TENGE", 100, y + 34, 24, G, "left"); txt("87.4% confident", 100, y + 56, 11, "#4fbf68", "left", "500");
  y += 92;
  // probabilities
  section(y, "CLASS PROBABILITIES"); y += 28;
  const order = [2, 3, 1, 0, 4];
  order.forEach(i => {
    txt(CLS[i], 24, y + 12, 13, TXT, "left", "700"); ctx.fillStyle = "rgba(255,255,255,.07)"; rr(64, y + 2, W - 150, 14, 7); ctx.fill();
    ctx.fillStyle = CCOL[i]; rr(64, y + 2, Math.max(6, (W - 150) * PROB[i] * a), 14, 7); ctx.fill();
    txt((PROB[i] * 100 * a).toFixed(1) + "%", W - 24, y + 14, 12, TXT, "right", "600"); y += 28;
  });
  txt("5 ↔ 10 and 20 ↔ 50 are the confusions found in the paper", 24, y + 8, 10, WARN, "left", "500"); y += 36;
  // neighbours
  section(y, "NEAREST COINS IN THE TRAINING SET"); y += 22;
  const tw = (W - 48 - 4 * 8) / 5;
  NB.forEach(([k, c, s], i) => {
    const x = 24 + i * (tw + 8); thumb(IMG[k], x, y, tw); ctx.strokeStyle = c === "20" ? G : WARN; ctx.lineWidth = 1.6; ctx.strokeRect(x, y, tw, tw);
    txt(c, x + tw / 2, y + tw + 15, 11, c === "20" ? G : WARN, "center", "700"); txt(s.toFixed(2), x + tw / 2, y + tw + 29, 9, "#3f9a55", "center", "500");
  });
  y += tw + 46; txt("kNN vote (k=5): 20 tenge, 4 of 5", 24, y, 11, TXT, "left", "600"); y += 28;
  // attention
  section(y, "WHERE THE MODEL LOOKS"); y += 18;
  const pw = (W - 48 - 12) / 2;
  thumb(IMG.q, 24, y, pw, .55); thumb(IMG.q, 24 + pw + 12, y, pw, .55);
  const hx = 24 + pw + 12;
  ctx.save(); ctx.beginPath(); ctx.rect(hx, y, pw, pw); ctx.clip();
  [[.42, .38, .5, 1], [.62, .6, .34, .8], [.5, .5, .75, .5]].forEach(([u, v, r, al]) => {
    const g = ctx.createRadialGradient(hx + pw * u, y + pw * v, 2, hx + pw * u, y + pw * v, pw * r * .6);
    g.addColorStop(0, `rgba(255,60,20,${.78 * al})`); g.addColorStop(.45, `rgba(255,210,40,${.45 * al})`); g.addColorStop(1, "rgba(255,210,40,0)");
    ctx.fillStyle = g; ctx.fillRect(hx, y, pw, pw);
  }); ctx.restore();
  ctx.strokeStyle = GD; ctx.strokeRect(24, y, pw, pw); ctx.strokeRect(hx, y, pw, pw);
  y += pw + 16; txt("crop", 24 + pw / 2, y, 10, "#3f9a55", "center", "600"); txt("attention (placeholder)", hx + pw / 2, y, 10, "#3f9a55", "center", "600"); y += 30;
  // embedding map
  section(y, "EMBEDDING MAP  (PCA, 2D)"); y += 18;
  const mw = W - 48, mh = 190;
  ctx.fillStyle = "rgba(0,255,65,.04)"; ctx.fillRect(24, y, mw, mh); ctx.strokeStyle = GD; ctx.strokeRect(24, y, mw, mh);
  const R = rng(7), ctr = [[.16, .30], [.30, .62], [.62, .30], [.74, .52], [.86, .80]];
  ctr.forEach(([u, v], i) => { for (let n = 0; n < 26; n++) {
    const px = 24 + mw * (u + (R() + R() + R() - 1.5) * .07), py = y + mh * (v + (R() + R() + R() - 1.5) * .11);
    ctx.fillStyle = CCOL[i]; ctx.globalAlpha = .75; ctx.beginPath(); ctx.arc(px, py, 2.6, 0, 7); ctx.fill(); ctx.globalAlpha = 1; } });
  const qx = 24 + mw * .66, qy = y + mh * .36, pu = (nowMs / 1200) % 1;
  ctx.save(); ctx.strokeStyle = "#fff"; ctx.shadowColor = "#fff"; ctx.shadowBlur = 10; ctx.lineWidth = 1.4; ctx.globalAlpha = 1 - pu; ctx.beginPath(); ctx.arc(qx, qy, 6 + pu * 16, 0, 7); ctx.stroke(); ctx.restore();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(qx, qy, 4.5, 0, 7); ctx.fill(); txt("your coin", qx + 10, qy - 10, 10, "#fff", "left", "700");
  CLS.forEach((c, i) => { ctx.fillStyle = CCOL[i]; ctx.beginPath(); ctx.arc(34 + i * 54, y + mh + 18, 4, 0, 7); ctx.fill(); txt(c, 43 + i * 54, y + mh + 22, 10, TXT, "left", "600"); });
  y += mh + 48;
  // system
  section(y, "SYSTEM"); y += 28;
  const ua = /iPhone|iPad/.test(navigator.userAgent) ? "Safari · iOS" : /Android/.test(navigator.userAgent) ? "Chrome · Android" : "desktop browser (preview)";
  [["inference", "12 ms (model only)"], ["server", "MacBook · mps"], ["browser", ua], ["model", "DINOv2 ViT-S/14 · 22 M params"], ["input", "coin crop 224 × 224"]].forEach(([k, v]) => {
    txt(k, 24, y, 11, "#3f9a55", "left", "600"); txt(v, W - 24, y, 11, TXT, "right", "600"); y += 22; });
  y += 24;
  scrollMax = Math.max(0, y - (H - top - 80));
  ctx.restore(); ctx.restore();
}
let dt0 = performance.now();

// ---------- loop, input
const hit = {};
let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(.05, (nowMs - last) / 1000); last = nowMs;
  const t = (nowMs - t0) / 1000;
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0); ctx.clearRect(0, 0, W, H);
  Object.keys(hit).forEach(k => delete hit[k]);
  if (state === "search" && t > 2.7) setState("lock");
  else if (state === "lock" && t > 1.0) setState("zoom");
  else if (state === "zoom" && t > .95) setState("result");
  const tt = (nowMs - t0) / 1000;
  if (state === "home") drawHome(tt, nowMs);
  else if (state === "search") drawSearch(tt, nowMs, "search");
  else if (state === "lock") drawSearch(tt, nowMs, "lock");
  else if (state === "zoom") drawZoom(tt, nowMs);
  else { drawResult((nowMs - resultT0) / 1000, nowMs); }
  const target = state === "details" ? 1 : 0;
  sheetP += (target - sheetP) * Math.min(1, dt * 11); if (Math.abs(target - sheetP) < .002) sheetP = target;
  if (state === "details" && sheetP < .05) dt0 = nowMs;
  if (sheetP > 0.001) { drawSheet(ease(sheetP), nowMs); hit.more = null; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const inRect = (x, y, r) => r && x >= r[0] && x <= r[0] + r[2] && y >= r[1] && y <= r[1] + r[3];
let drag = null;
function pos(e) { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / S, (e.clientY - b.top) / S]; }
cv.addEventListener("pointerdown", e => { const [x, y] = pos(e); drag = { x, y, sy: scrollY, moved: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (!drag) return; const [x, y] = pos(e); if (Math.abs(y - drag.y) > 6) drag.moved = true;
  if (state === "details" && drag.moved && y > hit.sheetTop) scrollY = Math.max(0, Math.min(scrollMax, drag.sy - (y - drag.y))); });
cv.addEventListener("pointerup", e => {
  const [x, y] = pos(e); const d = drag; drag = null; if (!d) return;
  if (d.moved && state === "details") { if (scrollY === 0 && y - d.y > 90) setState("result"); return; }
  if (state === "home" && inRect(x, y, hit.start)) { audio(); setState("search"); }
  else if (state === "result" && sheetP < .05) { if (inRect(x, y, hit.more)) setState("details"); else if (inRect(x, y, hit.close)) setState("search"); }
  else if (state === "details") { if (inRect(x, y, hit.sheetClose) || y < hit.sheetTop - 4) setState("result"); }
});
cv.addEventListener("wheel", e => { if (state === "details") { e.preventDefault(); scrollY = Math.max(0, Math.min(scrollMax, scrollY + e.deltaY)); } }, { passive: false });
</script>
